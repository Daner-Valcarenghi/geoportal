<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal REURB</title>

    <!-- OpenLayers CSS/JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js"></script>

    <!-- Proj4js (EPSG:4674 - SIRGAS 2000) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>

    <!-- JSZip & Mapbox shp-write: Gerador de Shapefile (.ZIP) no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mapbox/shp-write@latest/shpwrite.js"></script>

    <style>
        /* Base e estrutura da página */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            font-family: Arial, sans-serif; 
            overflow: hidden;
        }

        #map { 
            width: 100%; 
            height: 100%; 
        }

        /* --- ESTILO DO TÍTULO E AJUSTES RESPONSIVOS --- */
        .map-title {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.92);
            padding: 6px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            border: 1px solid #cccccc;
            pointer-events: none;
            max-width: calc(100% - 220px);
        }

        .map-title h1 {
            margin: 0;
            font-size: 15px;
            font-weight: bold;
            color: #1a252f;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .map-title h2 {
            margin: 1px 0 0 0;
            font-size: 11px;
            font-weight: normal;
            color: #555555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Posicionamento dos Botões de Zoom no Desktop */
        .ol-zoom {
            top: 10px !important;
            left: 10px !important;
        }

        /* --- REGRAS EXCLUSIVAS PARA CELULAR (Mobile) --- */
        @media (max-width: 600px) {
            .map-title {
                left: 10px;
                top: 10px;
                padding: 4px 8px;
                max-width: 160px;
            }

            .map-title h1 {
                font-size: 11px;
            }

            .map-title h2 {
                font-size: 9px;
            }

            .ol-zoom {
                top: 55px !important;
                left: 10px !important;
            }
        }

        /* Estilo do Popup */
        .ol-popup {
            position: absolute;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 200px;
        }
        .ol-popup:after, .ol-popup:before {
            top: 100%; 
            border: solid transparent; 
            content: " ";
            height: 0; 
            width: 0; 
            position: absolute; 
            pointer-events: none;
        }
        .ol-popup:after { 
            border-top-color: #ffffff; 
            border-width: 10px; 
            left: 48px; 
            margin-left: -10px; 
        }
        .ol-popup-closer { 
            text-decoration: none; 
            position: absolute; 
            top: 4px; 
            right: 8px; 
            color: #888888; 
            font-weight: bold; 
        }

        /* Contêiner do Painel de Controle Recolhível */
        .map-menu-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .menu-toggle-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }
        .menu-toggle-btn:hover {
            background: #f0f0f0;
        }

        .map-menu {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 13px;
            line-height: 1.5;
            margin-top: 5px;
            max-width: 270px;
            transition: all 0.3s ease-in-out;
        }

        .map-menu.collapsed {
            display: none;
        }

        /* Estilo das linhas das camadas no menu com botão de download */
        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .layer-label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .btn-download-shp {
            background: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-left: 8px;
            white-space: nowrap;
        }
        .btn-download-shp:hover {
            background: #28a745;
            color: #ffffff;
            border-color: #28a745;
        }
        
        .menu-section {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .measure-btn {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-right: 2px;
            margin-top: 4px;
        }
        .measure-btn:hover { background: #0056b3; }

        /* Botão de GPS / Localização */
        .location-btn {
            position: absolute;
            bottom: 80px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            user-select: none;
            transition: background 0.2s;
        }
        .location-btn:hover { background: #ffffff; }

        /* Seta Norte */
        .north-arrow-btn {
            position: absolute;
            bottom: 35px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            transition: transform 0.1s linear;
        }
        .north-arrow-btn:hover { background: #ffffff; }

        /* Barra de Escala */
        .ol-scale-line {
            left: 10px !important;
            bottom: 10px !important;
            background: rgba(0, 60, 136, 0.7) !important;
        }
    </style>
</head>

<body>

<!-- Título no Canto Superior Esquerdo -->
<div class="map-title">
    <h1>GEOPORTAL REURB</h1>
    <h2>NÚCLEO VB</h2>
</div>

<div id="map"></div>

<!-- Balão de Informações (Popup) -->
<div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer">✕</a>
    <div id="popup-content"></div>
</div>

<!-- Botão de GPS / Localização -->
<button id="btn-location" class="location-btn" title="Minha Localização">🎯</button>

<!-- Botão da Seta Norte -->
<button id="btn-north" class="north-arrow-btn" title="Clique para reorientar para o Norte">N ↑</button>

<!-- Gerenciador de Camadas e Medição -->
<div class="map-menu-container">
    <button id="btn-toggle-menu" class="menu-toggle-btn">
        <span>Camadas & Ferramentas</span>
        <span id="toggle-icon">▼</span>
    </button>

    <div id="map-menu" class="map-menu">
        <div>
            <b>Camadas Vetoriais:</b><br>
            
            <div class="layer-item">
                <label class="layer-label">
                    <input type="checkbox" id="chk-perimetro" checked> Perímetro
                </label>
                <button class="btn-download-shp" id="dl-perimetro" title="Baixar Shapefile (.zip)">SHP ⬇</button>
            </div>

            <div class="layer-item">
                <label class="layer-label">
                    <input type="checkbox" id="chk-lotes" checked> Lotes REURB
                </label>
                <button class="btn-download-shp" id="dl-lotes" title="Baixar Shapefile (.zip)">SHP ⬇</button>
            </div>

            <div class="layer-item">
                <label class="layer-label">
                    <input type="checkbox" id="chk-edificacoes" checked> Edificações
                </label>
                <button class="btn-download-shp" id="dl-edificacoes" title="Baixar Shapefile (.zip)">SHP ⬇</button>
            </div>

            <div class="layer-item">
                <label class="layer-label">
                    <input type="checkbox" id="chk-viario" checked> Sistema Viário
                </label>
                <button class="btn-download-shp" id="dl-viario" title="Baixar Shapefile (.zip)">SHP ⬇</button>
            </div>
        </div>

        <div class="menu-section">
            <b>Fundo de Mapa:</b><br>
            <input type="radio" id="ortofoto" name="baseMap" value="ortofoto" checked>
            <label for="ortofoto">Ortofoto Local</label><br>
            <input type="radio" id="osm" name="baseMap" value="osm">
            <label for="osm">OpenStreetMap</label>
        </div>

        <div class="menu-section">
            <b>Ferramentas de Medição:</b><br>
            <button id="btn-dist" class="measure-btn">Distância</button>
            <button id="btn-area" class="measure-btn">Área</button>
            <button id="btn-clear" class="measure-btn" style="background:#6c757d;">Limpar</button>
        </div>
    </div>
</div>

<script>
    // 1. Registro de CRS EPSG:4674 (SIRGAS 2000)
    proj4.defs("EPSG:4674", "+proj=longlat +ellps=GRS80 +no_defs +type=crs");
    ol.proj.proj4.register(proj4);

    // 2. Camadas Base
    const osmLayer = new ol.layer.Tile({
        source: new ol.source.OSM(),
        visible: false
    });

    const ortofotoLayer = new ol.layer.Tile({
        source: new ol.source.XYZ({
            url: 'ortofoto_tiles/{z}/{x}/{y}.png',
            maxZoom: 21,
            attributions: 'Ortofoto © Prefeitura Municipal'
        }),
        visible: true
    });

    // 3. Camadas Vetoriais
    const perimetroSource = new ol.source.Vector({
        url: 'PERÍMETRO_DO_NÚCLEO.geojson',
        format: new ol.format.GeoJSON({ dataProjection: 'EPSG:4674', featureProjection: 'EPSG:3857' })
    });
    const perimetroLayer = new ol.layer.Vector({
        source: perimetroSource,
        visible: true,
        style: new ol.style.Style({
            stroke: new ol.style.Stroke({ color: '#000000', width: 3, lineDash: [6, 6] }),
            fill: new ol.style.Fill({ color: 'rgba(0, 0, 0, 0.0)' })
        })
    });

    const lotesSource = new ol.source.Vector({
        url: 'PRELIMINAR_LOTES.geojson',
        format: new ol.format.GeoJSON({ dataProjection: 'EPSG:4674', featureProjection: 'EPSG:3857' })
    });
    const lotesLayer = new ol.layer.Vector({
        source: lotesSource,
        visible: true,
        style: new ol.style.Style({
            stroke: new ol.style.Stroke({ color: '#33fa2c', width: 2 }),
            fill: new ol.style.Fill({ color: 'rgba(255, 0, 0, 0.0)' })
        })
    });

    const edificacoesSource = new ol.source.Vector({
        url: 'EDIFICACOES.geojson',
        format: new ol.format.GeoJSON({ dataProjection: 'EPSG:4674', featureProjection: 'EPSG:3857' })
    });
    const edificacoesLayer = new ol.layer.Vector({
        source: edificacoesSource,
        visible: true,
        style: new ol.style.Style({
            stroke: new ol.style.Stroke({ color: '#e31a1c', width: 1.5 }),
            fill: new ol.style.Fill({ color: 'rgba(128, 0, 128, 0.0)' })
        })
    });

    const viarioSource = new ol.source.Vector({
        url: 'SISTEMA_VIARIO.geojson',
        format: new ol.format.GeoJSON({ dataProjection: 'EPSG:4674', featureProjection: 'EPSG:3857' })
    });

    function estiloSistemaViario(feature, resolution) {
        const larguraEmMetros = 4;
        const larguraEmPixels = Math.max(larguraEmMetros / resolution, 3);
        const nomeVia = feature.get('NOME') || '';

        return [
            new ol.style.Style({
                stroke: new ol.style.Stroke({ color: '#666666', width: larguraEmPixels + 2 })
            }),
            new ol.style.Style({
                stroke: new ol.style.Stroke({ color: '#ffffff', width: larguraEmPixels }),
                text: new ol.style.Text({
                    text: String(nomeVia),
                    font: 'bold 12px Arial, sans-serif',
                    fill: new ol.style.Fill({ color: '#222222' }),
                    stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 }),
                    placement: 'line',
                    overflow: true
                })
            })
        ];
    }

    const viarioLayer = new ol.layer.Vector({
        source: viarioSource,
        visible: true,
        style: estiloSistemaViario
    });

    // 4. Camada de Medição
    const measureSource = new ol.source.Vector();
    const measureLayer = new ol.layer.Vector({
        source: measureSource,
        style: new ol.style.Style({
            fill: new ol.style.Fill({ color: 'rgba(255, 255, 255, 0.2)' }),
            stroke: new ol.style.Stroke({ color: '#ffcc33', width: 3 }),
            image: new ol.style.Circle({
                radius: 6,
                fill: new ol.style.Fill({ color: '#ffcc33' })
            })
        })
    });

    // 5. Camada de Geolocalização (GPS)
    const positionFeature = new ol.Feature();
    positionFeature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
            radius: 8,
            fill: new ol.style.Fill({ color: '#007bff' }),
            stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 })
        })
    }));

    const accuracyFeature = new ol.Feature();
    accuracyFeature.setStyle(new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(0, 123, 255, 0.15)' }),
        stroke: new ol.style.Stroke({ color: 'rgba(0, 123, 255, 0.4)', width: 1 })
    }));

    const locationSource = new ol.source.Vector({
        features: [accuracyFeature, positionFeature]
    });
    const locationLayer = new ol.layer.Vector({
        source: locationSource
    });

    // 6. Popup Overlay
    const popupContainer = document.getElementById('popup');
    const popupContent = document.getElementById('popup-content');
    const popupCloser = document.getElementById('popup-closer');

    const overlay = new ol.Overlay({
        element: popupContainer,
        autoPan: { animation: { duration: 250 } }
    });

    popupCloser.onclick = function () {
        overlay.setPosition(undefined);
        popupCloser.blur();
        return false;
    };

    // 7. Barra de Escala
    const scaleLineControl = new ol.control.ScaleLine({
        units: 'metric',
        bar: true,
        steps: 4,
        text: true,
        minWidth: 140
    });

    // 8. Mapa e Visão
    const view = new ol.View({
        center: ol.proj.fromLonLat([-55, -30]),
        zoom: 5,
        enableRotation: true
    });

    const map = new ol.Map({
        target: 'map',
        controls: ol.control.defaults.defaults().extend([scaleLineControl]),
        layers: [osmLayer, ortofotoLayer, perimetroLayer, lotesLayer, edificacoesLayer, viarioLayer, measureLayer, locationLayer],
        overlays: [overlay],
        view: view
    });

    // Auto-fit nos lotes
    lotesSource.on('change', function () {
        if (lotesSource.getState() === 'ready' && lotesSource.getFeatures().length > 0) {
            map.getView().fit(lotesSource.getExtent(), { padding: [50, 50, 50, 50], duration: 1000 });
        }
    });

    // 9. Geolocalização por GPS
    const geolocation = new ol.Geolocation({
        trackingOptions: {
            enableHighAccuracy: true
        },
        projection: view.getProjection()
    });

    geolocation.on('change:accuracyGeometry', function () {
        accuracyFeature.setGeometry(geolocation.getAccuracyGeometry());
    });

    geolocation.on('change:position', function () {
        const coordinates = geolocation.getPosition();
        positionFeature.setGeometry(coordinates ? new ol.Point(coordinates) : null);
    });

    geolocation.on('error', function (error) {
        alert('Não foi possível obter a sua localização. Verifique as permissões do seu navegador/GPS.');
    });

    const locationBtn = document.getElementById('btn-location');
    locationBtn.onclick = function () {
        geolocation.setTracking(true);
        const coordinates = geolocation.getPosition();
        if (coordinates) {
            view.animate({
                center: coordinates,
                zoom: 18,
                duration: 1000
            });
        } else {
            // Caso ainda esteja buscando a primeira posição
            geolocation.once('change:position', function () {
                const pos = geolocation.getPosition();
                if (pos) {
                    view.animate({
                        center: pos,
                        zoom: 18,
                        duration: 1000
                    });
                }
            });
        }
    };

    // 10. Rotação Dinâmica da Seta Norte
    const northBtn = document.getElementById('btn-north');
    view.on('change:rotation', function () {
        northBtn.style.transform = `rotate(${view.getRotation()}rad)`;
    });
    northBtn.onclick = function () {
        view.animate({ rotation: 0, duration: 350 });
    };

    // 11. Controle de Expansão/Recolhimento do Menu
    const menuToggleBtn = document.getElementById('btn-toggle-menu');
    const mapMenu = document.getElementById('map-menu');
    const toggleIcon = document.getElementById('toggle-icon');

    menuToggleBtn.onclick = function () {
        mapMenu.classList.toggle('collapsed');
        toggleIcon.textContent = mapMenu.classList.contains('collapsed') ? '▲' : '▼';
    };

    // 12. Alternância de Visibilidade das Camadas
    document.getElementById('chk-perimetro').addEventListener('change', e => perimetroLayer.setVisible(e.target.checked));
    document.getElementById('chk-lotes').addEventListener('change', e => {
        lotesLayer.setVisible(e.target.checked);
        if (!e.target.checked) overlay.setPosition(undefined);
    });
    document.getElementById('chk-edificacoes').addEventListener('change', e => edificacoesLayer.setVisible(e.target.checked));
    document.getElementById('chk-viario').addEventListener('change', e => viarioLayer.setVisible(e.target.checked));

    document.querySelectorAll('input[name="baseMap"]').forEach(elem => {
        elem.addEventListener('change', e => {
            osmLayer.setVisible(e.target.value === 'osm');
            ortofotoLayer.setVisible(e.target.value === 'ortofoto');
        });
    });

    // 13. FUNÇÃO DE EXPORTAÇÃO PARA SHAPEFILE (.ZIP)
    function downloadShapefile(source, layerName) {
        const features = source.getFeatures();
        if (features.length === 0) {
            alert('A camada ainda não possui feições carregadas.');
            return;
        }

        const format = new ol.format.GeoJSON({
            dataProjection: 'EPSG:4674',
            featureProjection: 'EPSG:3857'
        });

        const geojsonObject = format.writeFeaturesObject(features);

        const options = {
            folder: layerName,
            types: {
                point: layerName + '_pontos',
                polygon: layerName,
                line: layerName + '_linhas'
            }
        };

        try {
            shpwrite.zip(geojsonObject, options).then(function(content) {
                let blob;
                if (typeof content === 'string') {
                    const byteCharacters = atob(content);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    blob = new Blob([byteArray], { type: 'application/zip' });
                } else {
                    blob = new Blob([content], { type: 'application/zip' });
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = layerName + '.zip';
                document.body.appendChild(a);
                a.click();

                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }).catch(function(err) {
                console.error('Erro ao gerar Shapefile:', err);
                alert('Ocorreu um erro ao converter a camada para Shapefile.');
            });
        } catch (e) {
            console.error(e);
            alert('Erro ao processar os dados vetoriais.');
        }
    }

    // Eventos de clique nos botões "SHP ⬇"
    document.getElementById('dl-perimetro').onclick = () => downloadShapefile(perimetroSource, 'PERIMETRO_NUCLEO');
    document.getElementById('dl-lotes').onclick = () => downloadShapefile(lotesSource, 'PRELIMINAR_LOTES');
    document.getElementById('dl-edificacoes').onclick = () => downloadShapefile(edificacoesSource, 'EDIFICACOES');
    document.getElementById('dl-viario').onclick = () => downloadShapefile(viarioSource, 'SISTEMA_VIARIO');

    // 14. Identificação de feições via clique (Popup)
    map.on('singleclick', function (evt) {
        if (draw) return;

        const feature = map.forEachFeatureAtPixel(evt.pixel, f => f, {
            layerFilter: layer => layer === lotesLayer || layer === edificacoesLayer || layer === perimetroLayer || layer === viarioLayer
        });

        if (feature) {
            const properties = feature.getProperties();
            let htmlContent = '<h4 style="margin:0 0 8px 0;">Atributos do Elemento</h4><ul style="padding-left:15px; margin:0;">';

            for (let prop in properties) {
                if (prop !== 'geometry') {
                    htmlContent += `<li><b>${prop}:</b> ${properties[prop]}</li>`;
                }
            }
            htmlContent += '</ul>';

            popupContent.innerHTML = htmlContent;
            overlay.setPosition(evt.coordinate);
        } else {
            overlay.setPosition(undefined);
        }
    });

    // 15. Ferramenta de Desenho/Medição
    let draw;

    function addInteraction(type) {
        if (draw) map.removeInteraction(draw);

        draw = new ol.interaction.Draw({
            source: measureSource,
            type: type
        });

        draw.on('drawend', function (evt) {
            const geom = evt.feature.getGeometry();
            let output;

            if (type === 'LineString') {
                const length = ol.sphere.getLength(geom);
                output = length > 1000 ? (length / 1000).toFixed(2) + ' km' : length.toFixed(2) + ' m';
                alert('Distância Medida: ' + output);
            } else if (type === 'Polygon') {
                const area = ol.sphere.getArea(geom);
                output = area > 10000 ? (area / 10000).toFixed(2) + ' ha' : area.toFixed(2) + ' m²';
                alert('Área Medida: ' + output);
            }
            map.removeInteraction(draw);
            draw = null;
        });

        map.addInteraction(draw);
    }

    document.getElementById('btn-dist').onclick = () => addInteraction('LineString');
    document.getElementById('btn-area').onclick = () => addInteraction('Polygon');
    document.getElementById('btn-clear').onclick = () => {
        if (draw) {
            map.removeInteraction(draw);
            draw = null;
        }
        measureSource.clear();
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meu Geoportal</title>

    <!-- OpenLayers -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css">

    <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js"></script>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    // ==========================================
    // MAPA BASE
    // ==========================================

    const baseMap = new ol.layer.Tile({
        source: new ol.source.OSM()
    });


    // ==========================================
    // CAMADA DE LOTES (Sem espaço no nome do arquivo)
    // ==========================================

    const lotesSource = new ol.source.Vector({

        url: 'PRELIMINAR_LOTES.geojson',

        format: new ol.format.GeoJSON({

            dataProjection: 'EPSG:4326',

            featureProjection: 'EPSG:3857'

        })

    });


    // Estilo básico para visualização dos polígonos
    const lotesStyle = new ol.style.Style({
        stroke: new ol.style.Stroke({
            color: '#0055ff',
            width: 2
        }),
        fill: new ol.style.Fill({
            color: 'rgba(0, 85, 255, 0.2)'
        })
    });


    const lotes = new ol.layer.Vector({

        source: lotesSource,

        style: lotesStyle

    });


    // ==========================================
    // CRIAÇÃO DO MAPA
    // ==========================================

    const map = new ol.Map({

        target: 'map',

        layers: [

            baseMap,

            lotes

        ],

        view: new ol.View({

            center: ol.proj.fromLonLat([
                -55,
                -30
            ]),

            zoom: 5

        })

    });


    // ==========================================
    // ENQUADRAR AUTOMATICAMENTE OS LOTES
    // ==========================================

    lotesSource.on('change', function () {

        const state = lotesSource.getState();

        if (state === 'ready' && lotesSource.getFeatures().length > 0) {

            const extent = lotesSource.getExtent();

            map.getView().fit(

                extent,

                {
                    padding: [50, 50, 50, 50],
                    maxZoom: 18,
                    duration: 1000
                }

            );

        } else if (state === 'error') {

            console.error('Erro ao carregar o arquivo GeoJSON. Verifique se o nome "PRELIMINAR_LOTES.geojson" está correto na pasta e se a página está rodando em um servidor HTTP (ex: Live Server).');

        }

    });

</script>

</body>

</html>

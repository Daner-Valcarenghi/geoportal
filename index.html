            height: 100%; 
        }

        /* Estilo do Popup dos Lotes */
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 220px;
        }
        .ol-popup:after, .ol-popup:before {
            top: 100%; 
            border: solid transparent; 
            content: " ";
            height: 0; 
            width: 0; 
            position: absolute; 
            pointer-events: none;
        }
        .ol-popup:after { 
            border-top-color: white; 
            border-width: 10px; 
            left: 48px; 
            margin-left: -10px; 
        }
        .ol-popup-closer { 
            text-decoration: none; 
            position: absolute; 
            top: 2px; 
            right: 8px; 
            color: #999; 
            font-weight: bold; 
        }

        /* Menu de Painel de Camadas e Ferramentas */
        .map-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            font-size: 13px;
        }

        .measure-tools {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }

        .measure-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 4px;
            margin-top: 5px;
        }
        .measure-btn:hover { background: #0056b3; }

        /* Seta Norte */
        .north-arrow {
            position: absolute;
            top: 10px;
            left: 50px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 10px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            font-weight: bold;
            font-size: 14px;
        }

        /* Estilo para Rótulos das Medições */
        .ol-tooltip {
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            color: white;
            padding: 4px 8px;
            opacity: 0.85;
            white-space: nowrap;
            font-size: 12px;
        }
        .ol-tooltip-measure { opacity: 1; font-weight: bold; }

        .ol-scale-line {
            background: rgba(255, 255, 255, 0.85) !important;
            border-radius: 4px;
            padding: 2px 5px;
        }
        .ol-scale-line-inner {
            border: 2px solid #333 !important;
            border-top: none !important;
            color: #000 !important;
            font-weight: bold;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meu Geoportal</title>

    <!-- OpenLayers CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css">

    <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js"></script>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    // ==========================================
    // MAPA BASE (OpenStreetMap)
    // ==========================================

    const baseMap = new ol.layer.Tile({
        source: new ol.source.OSM()
    });


    // ==========================================
    // CAMADA DE LOTES (GeoJSON)
    // ==========================================

    const lotesSource = new ol.source.Vector({

        url: 'PRELIMINAR_LOTES.geojson',

        format: new ol.format.GeoJSON({

            dataProjection: 'EPSG:4326',   // Projeção do GeoJSON original

            featureProjection: 'EPSG:3857' // Projeção da exibição do mapa

        })

    });


    // Estilo dos Polígonos
    const lotesStyle = new ol.style.Style({
        stroke: new ol.style.Stroke({
            color: '#ff0000', // Vermelho para destaque
            width: 2
        }),
        fill: new ol.style.Fill({
            color: 'rgba(255, 0, 0, 0.25)'
        })
    });


    const lotes = new ol.layer.Vector({

        source: lotesSource,

        style: lotesStyle

    });


    // ==========================================
    // CRIAÇÃO DO MAPA
    // ==========================================

    const map = new ol.Map({

        target: 'map',

        layers: [

            baseMap,

            lotes

        ],

        view: new ol.View({

            center: ol.proj.fromLonLat([
                -55,
                -30
            ]),

            zoom: 5

        })

    });


    // ==========================================
    // ENQUADRAR AUTOMATICAMENTE (COM VERIFICAÇÃO)
    // ==========================================

    lotesSource.on('change', function () {

        const state = lotesSource.getState();

        if (state === 'ready') {

            const features = lotesSource.getFeatures();

            if (features.length > 0) {

                const extent = lotesSource.getExtent();

                map.getView().fit(extent, {
                    padding: [50, 50, 50, 50],
                    maxZoom: 18,
                    duration: 1000
                });

                console.log(`Sucesso: ${features.length} feições carregadas.`);

            } else {

                console.warn('O arquivo GeoJSON foi lido, mas não contém polígonos válidos ou está vazio.');

            }

        } else if (state === 'error') {

            console.error('ERRO: Não foi possível carregar o arquivo "PRELIMINAR_LOTES.geojson".');
            console.error('Certifique-se de estar usando um Servidor Local (ex: Live Server do VS Code) e de que o arquivo está na mesma pasta do código HTML.');

        }

    });

</script>

</body>

</html>

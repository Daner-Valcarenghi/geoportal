<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meu Geoportal</title>

    <!-- OpenLayers -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css">

    <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js"></script>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    // ==========================================
    // MAPA BASE
    // ==========================================

    const baseMap = new ol.layer.Tile({
        source: new ol.source.OSM()
    });


    // ==========================================
    // CAMADA DE LOTES
    // ==========================================

   const lotesSource = new ol.source.Vector({

    url: 'PRELIMINAR%20LOTES.geojson',

    format: new ol.format.GeoJSON({

        dataProjection: 'EPSG:4326',

        featureProjection: 'EPSG:3857'

    })

});


    const lotes = new ol.layer.Vector({

        source: lotesSource

    });


    // ==========================================
    // CRIAÇÃO DO MAPA
    // ==========================================

    const map = new ol.Map({

        target: 'map',

        layers: [

            baseMap,

            lotes

        ],

        view: new ol.View({

            center: ol.proj.fromLonLat([
                -55,
                -30
            ]),

            zoom: 5

        })

    });


    // ==========================================
    // ENQUADRAR AUTOMATICAMENTE OS LOTES
    // ==========================================

    lotesSource.once('change', function () {

        if (lotesSource.getState() === 'ready') {

            const extent = lotesSource.getExtent();

            map.getView().fit(

                extent,

                {
                    padding: [50, 50, 50, 50],
                    maxZoom: 18,
                    duration: 1000
                }

            );

        }

    });

</script>

</body>

</html>

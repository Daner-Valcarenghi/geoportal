<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meu Geoportal - SIRGAS 2000</title>

    <!-- OpenLayers CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js"></script>

    <!-- Proj4js (Necessário para dar suporte ao EPSG:4674 / SIRGAS 2000) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    // ==========================================
    // REGISTRO DO EPSG:4674 (SIRGAS 2000)
    // ==========================================
    proj4.defs("EPSG:4674", "+proj=longlat +ellps=GRS80 +no_defs +type=crs");
    ol.proj.proj4.register(proj4);


    // ==========================================
    // MAPA BASE (OpenStreetMap)
    // ==========================================

    const baseMap = new ol.layer.Tile({
        source: new ol.source.OSM()
    });


    // ==========================================
    // CAMADA DE LOTES (GeoJSON em EPSG:4674)
    // ==========================================

    const lotesSource = new ol.source.Vector({

        url: 'PRELIMINAR_LOTES.geojson',

        format: new ol.format.GeoJSON({

            dataProjection: 'EPSG:4674',   // Projeção real do seu arquivo (SIRGAS 2000)

            featureProjection: 'EPSG:3857' // Projeção do mapa

        })

    });


    // Estilo dos Lotes
    const lotesStyle = new ol.style.Style({
        stroke: new ol.style.Stroke({
            color: '#0055ff', // Azul
            width: 2
        }),
        fill: new ol.style.Fill({
            color: 'rgba(0, 85, 255, 0.25)'
        })
    });


    const lotes = new ol.layer.Vector({

        source: lotesSource,

        style: lotesStyle

    });


    // ==========================================
    // CRIAÇÃO DO MAPA
    // ==========================================

    const map = new ol.Map({

        target: 'map',

        layers: [

            baseMap,

            lotes

        ],

        view: new ol.View({

            center: ol.proj.fromLonLat([
                -55,
                -30
            ]),

            zoom: 5

        })

    });


    // ==========================================
    // ENQUADRAR AUTOMATICAMENTE NOS LOTES
    // ==========================================

    lotesSource.on('change', function () {

        const state = lotesSource.getState();

        if (state === 'ready') {

            const features = lotesSource.getFeatures();

            if (features.length > 0) {

                const extent = lotesSource.getExtent();

                map.getView().fit(extent, {
                    padding: [50, 50, 50, 50],
                    maxZoom: 18,
                    duration: 1000
                });

                console.log(`Sucesso: ${features.length} feições carregadas com EPSG:4674.`);

            } else {

                console.warn('O arquivo GeoJSON foi lido, mas não foram encontradas feições válidas.');

            }

        } else if (state === 'error') {

            console.error('ERRO: Falha ao carregar "PRELIMINAR_LOTES.geojson". Certifique-se de executar via servidor HTTP (ex: Live Server).');

        }

    });

</script>

</body>

</html>

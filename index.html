<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal REURB - Ortofoto Municipal</title>

    <!-- OpenLayers CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js"></script>

    <!-- Proj4js (EPSG:4674 - SIRGAS 2000) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>

    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            font-family: Arial, sans-serif; 
        }

        #map { 
            width: 100%; 
            height: 100%; 
        }

        /* Estilo do Popup */
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 220px;
        }
        .ol-popup:after, .ol-popup:before {
            top: 100%; 
            border: solid transparent; 
            content: " ";
            height: 0; 
            width: 0; 
            position: absolute; 
            pointer-events: none;
        }
        .ol-popup:after { 
            border-top-color: white; 
            border-width: 10px; 
            left: 48px; 
            margin-left: -10px; 
        }
        .ol-popup-closer { 
            text-decoration: none; 
            position: absolute; 
            top: 2px; 
            right: 8px; 
            color: #999; 
            font-weight: bold; 
        }

        /* Menu de controle de camadas */
        .map-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .map-menu label {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- Elemento HTML do Popup -->
<div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer">✕</a>
    <div id="popup-content"></div>
</div>

<!-- Menu para alternar mapa de fundo -->
<div class="map-menu">
    <label><b>Fundo de Mapa:</b></label><br>
    <input type="radio" id="ortofoto" name="baseMap" value="ortofoto" checked>
    <label for="ortofoto">Ortofoto Municipal</label><br>
    <input type="radio" id="osm" name="baseMap" value="osm">
    <label for="osm">OpenStreetMap</label>
</div>

<script>
    // 1. Registro do Sistema de Referência SIRGAS 2000 (EPSG:4674)
    proj4.defs("EPSG:4674", "+proj=longlat +ellps=GRS80 +no_defs +type=crs");
    ol.proj.proj4.register(proj4);

    // 2. Camada Mapa Base - OpenStreetMap (Desativada por padrão)
    const osmLayer = new ol.layer.Tile({
        source: new ol.source.OSM(),
        visible: false
    });

    // 3. Camada Mapa Base - Ortofoto Municipal (Pasta de Tiles XYZ enviada via GitHub Desktop)
    const ortofotoLayer = new ol.layer.Tile({
        source: new ol.source.XYZ({
            url: 'ortofoto_tiles/{z}/{x}/{y}.png',
            maxZoom: 21,
            attributions: 'Ortofoto © Prefeitura Municipal'
        }),
        visible: true
    });

    // 4. Camada Vetorial - Lotes da REURB (GeoJSON em SIRGAS 2000)
    const lotesSource = new ol.source.Vector({
        url: 'PRELIMINAR_LOTES.geojson',
        format: new ol.format.GeoJSON({
            dataProjection: 'EPSG:4674',
            featureProjection: 'EPSG:3857'
        })
    });

    const lotesLayer = new ol.layer.Vector({
        source: lotesSource,
        style: new ol.style.Style({
            stroke: new ol.style.Stroke({ 
                color: '#ff0000', 
                width: 2 
            }),
            fill: new ol.style.Fill({ 
                color: 'rgba(255, 0, 0, 0.15)' 
            })
        })
    });

    // 5. Configuração da Janela Popup
    const popupContainer = document.getElementById('popup');
    const popupContent = document.getElementById('popup-content');
    const popupCloser = document.getElementById('popup-closer');

    const overlay = new ol.Overlay({
        element: popupContainer,
        autoPan: { animation: { duration: 250 } }
    });

    popupCloser.onclick = function () {
        overlay.setPosition(undefined);
        popupCloser.blur();
        return false;
    };

    // 6. Inicialização do Mapa
    const map = new ol.Map({
        target: 'map',
        layers: [osmLayer, ortofotoLayer, lotesLayer],
        overlays: [overlay],
        view: new ol.View({
            center: ol.proj.fromLonLat([-55, -30]),
            zoom: 5
        })
    });

    // Ajuste automático da extensão do mapa ao carregar a camada de lotes
    lotesSource.on('change', function () {
        if (lotesSource.getState() === 'ready' && lotesSource.getFeatures().length > 0) {
            map.getView().fit(lotesSource.getExtent(), { 
                padding: [50, 50, 50, 50], 
                duration: 1000 
            });
        }
    });

    // Consulta de Atributos ao clicar no lote
    map.on('singleclick', function (evt) {
        const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);

        if (feature) {
            const properties = feature.getProperties();
            let htmlContent = '<h4 style="margin: 0 0 8px 0;">Dados do Lote (REURB)</h4><ul style="padding-left: 15px; margin: 0;">';

            for (let prop in properties) {
                if (prop !== 'geometry') {
                    htmlContent += `<li><b>${prop}:</b> ${properties[prop]}</li>`;
                }
            }
            htmlContent += '</ul>';

            popupContent.innerHTML = htmlContent;
            overlay.setPosition(evt.coordinate);
        } else {
            overlay.setPosition(undefined);
        }
    });

    // Alternador de Camadas Base (Ortofoto <-> OSM)
    document.querySelectorAll('input[name="baseMap"]').forEach(elem => {
        elem.addEventListener('change', function (e) {
            osmLayer.setVisible(e.target.value === 'osm');
            ortofotoLayer.setVisible(e.target.value === 'ortofoto');
        });
    });
